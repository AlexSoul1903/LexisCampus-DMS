services:
  # ============================================================================
  # SQL Server 2022 (Relational Database)
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lexiscampus-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-LexisCampus@Pass19}
      - MSSQL_PID=Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: >
       /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lexiscampus-network

  # ============================================================================
  # SeaweedFS (S3 Compatible Object Storage for Documents & Versions)
  # ----------------------------------------------------------------------------
  # Replaces MinIO: the MinIO community images were archived and are no longer
  # published (quay.io and Docker Hub return 401/404). SeaweedFS exposes the same
  # S3 API, so the application code and the MinIO .NET SDK client stay unchanged.
  # The service keeps the "minio" network alias for backward compatibility.
  # ============================================================================
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: lexiscampus-storage
    restart: unless-stopped
    command: server -s3 -dir=/data -master.volumeSizeLimitMB=1024
    ports:
      - "${MINIO_PORT:-9000}:8333" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:8888" # Filer web console
    volumes:
      - storage_data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      lexiscampus-network:
        aliases:
          - minio

  # ============================================================================
  # Backend (.NET 8 Web API - Onion Architecture)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: LexisCampusDMS.Server/Dockerfile
    container_name: lexiscampus-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LexisCampusDMS;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LexisCampus@Pass19};TrustServerCertificate=True;MultipleActiveResultSets=true;
      - Minio__Endpoint=storage:8333
      - Minio__AccessKey=${MINIO_ROOT_USER:-admin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-Admin@LexisCampus}
      - Minio__BucketName=${MINIO_DEFAULT_BUCKET:-lexiscampus-docs}
      - Minio__UseSsl=false
      - JwtSettings__Secret=${JWT_SECRET:-LexisCampusDMS_Development_SecretKey_AcademicProject_2026_MustBeAtLeast32BytesLong!}
      - JwtSettings__Issuer=LexisCampusDMS
      - JwtSettings__Audience=LexisCampusDMS.Clients
      - JwtSettings__ExpiryMinutes=60
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - lexiscampus-network

  # ============================================================================
  # Frontend (React 19 + Vite SPA with Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./lexiscampusdms.client
      dockerfile: Dockerfile
    container_name: lexiscampus-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - lexiscampus-network

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  mssql_data:
    driver: local
  storage_data:
    driver: local

networks:
  lexiscampus-network:
    driver: bridge
