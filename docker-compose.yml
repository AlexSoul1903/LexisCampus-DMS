services:
  # ============================================================================
  # SQL Server 2022 (Relational Database)
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lexiscampus-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lexiscampus-network

  # ============================================================================
  # MinIO (S3 Compatible Object Storage for Documents & Versions)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: lexiscampus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000" # MinIO S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # MinIO Web Management Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lexiscampus-network

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  mssql_data:
    driver: local
  minio_data:
    driver: local

networks:
  lexiscampus-network:
    driver: bridge
